spring:
  application:
    name: workflow-financiero
  config:
    # Permite leer variables locales desde .env sin versionar secretos.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow_financiero}
    username: ${DB_USER:workflow}
    password: ${DB_PASSWORD:workflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

flowable:
  async-executor-activate: true
  database-schema-update: true
  history-level: audit
  process-definition-location-prefix: classpath:/processes/

flujo:
  aprobacion:
    notificacion: ${APROBACION_DURACION_NOTIFICACION:PT24H}
    reasignacion: ${APROBACION_DURACION_REASIGNACION:PT48H}
    superiores:
      SUPERVISOR: GERENTE
      GERENTE: GERENTE_GENERAL
      RIESGOS: JEFE_RIESGOS

integracion:
  proveedor-financiero:
    url-base: ${PROVEEDOR_FINANCIERO_URL:http://localhost:8080/api/v1/integraciones/proveedor-financiero}
    tiempo-conexion: ${PROVEEDOR_FINANCIERO_TIEMPO_CONEXION:PT2S}
    tiempo-lectura: ${PROVEEDOR_FINANCIERO_TIEMPO_LECTURA:PT5S}
    secreto: ${PROVEEDOR_FINANCIERO_SECRETO:}

ejecucion:
  trabajador:
    habilitado: ${EJECUCION_TRABAJADOR_HABILITADO:false}
    intervalo-ms: ${EJECUCION_TRABAJADOR_INTERVALO_MS:2000}
    max-intentos: ${EJECUCION_TRABAJADOR_MAX_INTENTOS:3}
    reclamacion-vencida: ${EJECUCION_TRABAJADOR_RECLAMACION_VENCIDA:PT30S}
    reintento-espera: ${EJECUCION_TRABAJADOR_REINTENTO_ESPERA:PT5S}

seguridad:
  jwt:
    secreto: ${JWT_SECRETO:}
    emisor: ${JWT_EMISOR:workflow-financiero}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [corr=%X{identificadorCorrelacion:-}]"
