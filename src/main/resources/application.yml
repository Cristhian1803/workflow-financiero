spring:
  application:
    name: workflow-financiero
  config:
    # Permite leer variables locales desde .env sin versionar secretos.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow_financiero}
    username: ${DB_USER:workflow}
    password: ${DB_PASSWORD:workflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

flowable:
  async-executor-activate: true
  database-schema-update: true
  process-definition-location-prefix: classpath:/processes/

seguridad:
  jwt:
    secreto: ${JWT_SECRETO:}
    emisor: ${JWT_EMISOR:workflow-financiero}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [corr=%X{identificadorCorrelacion:-}]"
